name: Verify protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk-and-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/executor/src/daemon.js
      - run: npm run executor:demo -- --end
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32v1-none
      - run: cargo build --manifest-path contracts/Cargo.toml --locked --target wasm32v1-none --release -j 2
      - run: cargo test --manifest-path contracts/Cargo.toml --locked -j 2
