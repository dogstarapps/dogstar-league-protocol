[package]
name = "dogstar-zenex-adapter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
dogstar-zenex-types = { path = "../zenex-types" }
soroban-sdk = { workspace = true }
[dev-dependencies]
dogstar-protocol-types = { path = "../protocol-types" }
soroban-sdk = { workspace = true, features = ["testutils"] }
