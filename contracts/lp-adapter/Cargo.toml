[package]
name = "dogstar-lp-adapter"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
dogstar-lp-types = { path = "../lp-types" }
dogstar-protocol-types = { path = "../protocol-types" }
soroban-sdk = { workspace = true }
[dev-dependencies]
dogstar-lp-vault = { path = "../lp-vault" }
soroban-sdk = { workspace = true, features = ["testutils"] }
