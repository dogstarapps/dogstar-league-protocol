[package]
name = "dogstar-blend-adapter"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
dogstar-vault-types = { path = "../vault-types" }
dogstar-protocol-types = { path = "../protocol-types" }
soroban-sdk = { workspace = true }
[dev-dependencies]
dogstar-external-interfaces = { path = "../external-interfaces" }
soroban-sdk = { workspace = true, features = ["testutils"] }
