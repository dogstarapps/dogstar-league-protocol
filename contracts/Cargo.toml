[workspace]
resolver = "2"
members = ["tournament", "protocol-types", "registry", "factory", "spot-adapter", "price-policy", "external-interfaces", "cash-policy", "exit-facility", "spot-receipt", "vault-types", "blend-vault", "blend-adapter", "lp-types", "lp-vault", "lp-adapter", "direct-swap"]
[workspace.dependencies]
soroban-sdk = "=23.0.3"
[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
[profile.dev]
debug = 0
[profile.test]
debug = 0
