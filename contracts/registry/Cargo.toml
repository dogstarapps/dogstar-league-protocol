[package]
name = "dogstar-registry"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = { workspace = true }
dogstar-protocol-types = { path = "../protocol-types" }
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
